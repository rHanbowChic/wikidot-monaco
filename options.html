<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icons/logo.ico" />
    <title data-i18n="title"></title>
  </head>
  <body>
    <!-- Text comes from src/options/messages.ts, filled in by data-i18n key. -->
    <main>
      <header>
        <h1>Wikidot Monaco</h1>
      </header>

      <div class="layout">
        <!-- Categories; on narrow screens the list folds behind the toggle. -->
        <nav id="nav" data-i18n-label="categories">
          <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-list">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M2 4h12M2 8h12M2 12h12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
              />
            </svg>
            <span id="nav-current"></span>
          </button>
          <ul id="nav-list">
            <li><a href="#general" data-i18n="general"></a></li>
            <li><a href="#appearance" data-i18n="appearance"></a></li>
            <li><a href="#completion" data-i18n="completion"></a></li>
            <li><a href="#history" data-i18n="history"></a></li>
            <li><a href="#about" data-i18n="about"></a></li>
          </ul>
        </nav>

        <div class="content">
          <form id="settings">
            <section data-category="general" aria-labelledby="general-title">
              <h2 id="general-title" data-i18n="general"></h2>
              <div class="setting">
                <div class="title" data-i18n="enabled"></div>
                <label class="check">
                  <input type="checkbox" name="enabled" />
                  <span data-i18n="enabledHint"></span>
                </label>
              </div>
              <div class="setting">
                <label class="title" for="saveTimeout" data-i18n="saveTimeout"></label>
                <p class="description" data-i18n="saveTimeoutHint"></p>
                <input
                  id="saveTimeout"
                  type="number"
                  name="saveTimeout"
                  min="0"
                  max="600"
                  step="1"
                />
              </div>
            </section>

            <section data-category="appearance" aria-labelledby="appearance-title">
              <h2 id="appearance-title" data-i18n="appearance"></h2>
              <div class="setting">
                <label class="title" for="theme" data-i18n="theme"></label>
                <select id="theme" name="theme">
                  <option value="auto" data-i18n="themeAuto"></option>
                  <option value="light" data-i18n="themeLight"></option>
                  <option value="dark" data-i18n="themeDark"></option>
                </select>
              </div>
              <div class="setting">
                <label class="title" for="fontSize" data-i18n="fontSize"></label>
                <input id="fontSize" type="number" name="fontSize" min="10" max="28" step="1" />
              </div>
              <div class="setting">
                <label class="title" for="lineHeight" data-i18n="lineHeight"></label>
                <p class="description" data-i18n="lineHeightHint"></p>
                <input id="lineHeight" type="number" name="lineHeight" min="1" max="3" step="0.1" />
              </div>
              <div class="setting">
                <div class="title" data-i18n="wordWrap"></div>
                <label class="check">
                  <input type="checkbox" name="wordWrap" />
                  <span data-i18n="wordWrapHint"></span>
                </label>
              </div>
              <div class="setting">
                <div class="title" data-i18n="lineNumbers"></div>
                <label class="check">
                  <input type="checkbox" name="lineNumbers" />
                  <span data-i18n="lineNumbersHint"></span>
                </label>
              </div>
              <div class="setting">
                <div class="title" data-i18n="minimap"></div>
                <label class="check">
                  <input type="checkbox" name="minimap" />
                  <span data-i18n="minimapHint"></span>
                </label>
              </div>
            </section>

            <section data-category="completion" aria-labelledby="completion-title">
              <h2 id="completion-title" data-i18n="completion"></h2>
              <div class="setting">
                <label class="title" for="completion" data-i18n="trigger"></label>
                <select id="completion" name="completion">
                  <option value="auto" data-i18n="triggerAuto"></option>
                  <option value="manual" data-i18n="triggerManual"></option>
                  <option value="off" data-i18n="triggerOff"></option>
                </select>
              </div>
              <div class="setting">
                <div class="title" data-i18n="closeTags"></div>
                <label class="check">
                  <input type="checkbox" name="closeTags" />
                  <span data-i18n="closeTagsHint"></span>
                </label>
              </div>
            </section>

            <section data-category="history" aria-labelledby="history-title">
              <h2 id="history-title" data-i18n="history"></h2>
              <div class="setting">
                <label class="title" for="diffView" data-i18n="diffView"></label>
                <p class="description" data-i18n="diffViewHint"></p>
                <select id="diffView" name="diffView">
                  <option value="sideBySide" data-i18n="diffSideBySide"></option>
                  <option value="inline" data-i18n="diffInline"></option>
                </select>
              </div>
            </section>
          </form>

          <!-- Outside the form: nothing here is a setting. -->
          <section data-category="about" aria-labelledby="about-title">
            <h2 id="about-title" data-i18n="about"></h2>
            <div class="about-head">
              <img src="/icons/logo.svg" alt="" width="56" height="56" />
              <div>
                <div class="about-name">Wikidot Monaco</div>
                <p class="description" id="about-description"></p>
              </div>
            </div>
            <dl class="about-info">
              <dt data-i18n="aboutVersion"></dt>
              <dd id="version-extension"></dd>
              <dt data-i18n="aboutMonaco"></dt>
              <dd id="version-monaco"></dd>
              <dt data-i18n="aboutLicense"></dt>
              <dd>MIT</dd>
            </dl>
            <ul class="about-links">
              <li>
                <a
                  href="https://github.com/rHanbowChic/wikidot-monaco"
                  target="_blank"
                  rel="noopener"
                  data-i18n="aboutGitHub"
                ></a>
              </li>
              <li>
                <a
                  href="https://github.com/rHanbowChic/wikidot-monaco/blob/main/CHANGELOG.md"
                  target="_blank"
                  rel="noopener"
                  data-i18n="aboutChangelog"
                ></a>
              </li>
              <li>
                <a
                  href="https://github.com/rHanbowChic/wikidot-monaco/issues"
                  target="_blank"
                  rel="noopener"
                  data-i18n="aboutIssues"
                ></a>
              </li>
            </ul>
          </section>

          <footer id="footer">
            <button type="button" id="reset" data-i18n="reset"></button>
            <span id="status" aria-live="polite"></span>
            <!-- Shown in place of the reset button until the user confirms or cancels. -->
            <div id="reset-confirm" role="alertdialog" aria-describedby="reset-confirm-text" hidden>
              <p id="reset-confirm-text" data-i18n="resetConfirm"></p>
              <div class="actions">
                <button type="button" id="reset-yes" class="danger" data-i18n="resetYes"></button>
                <button type="button" id="reset-no" data-i18n="cancel"></button>
              </div>
            </div>
          </footer>
        </div>
      </div>
    </main>
    <script type="module" src="/src/options/index.ts"></script>
  </body>
</html>
